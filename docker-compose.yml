# Local development stack: PostgreSQL + API + single scheduler worker.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scanner
      POSTGRES_PASSWORD: scanner_dev_only
      POSTGRES_DB: stock_scanner
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scanner -d stock_scanner"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://scanner:scanner_dev_only@db:5432/stock_scanner
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://scanner:scanner_dev_only@db:5432/stock_scanner
    command: python -m app.scheduler
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  pgdata:
