name: Scheduled scans

# Times are UTC (IST = UTC+5:30). Each target has backup triggers because GitHub's scheduler can
# start late or skip a run; a scan that is already published is never run twice.
#   Morning scan 09:20 IST   -> 03:50 UTC (backups 04:05, 04:20)
#   Afternoon scan 15:00 IST -> 09:30 UTC (backups 09:40, 09:50)
#   Close performance 16:00 IST -> 10:30 UTC (backup 11:30)
# Weekends/NSE holidays are skipped by the app itself. A failed scan fails this job, and
# GitHub emails the repository owner.
on:
  schedule:
    - cron: "50 3 * * 1-5"
    - cron: "5 4 * * 1-5"
    - cron: "20 4 * * 1-5"
    - cron: "30 9 * * 1-5"
    - cron: "40 9 * * 1-5"
    - cron: "50 9 * * 1-5"
    - cron: "30 10 * * 1-5"
    - cron: "30 11 * * 1-5"
  workflow_dispatch: # "Run workflow" button for manual runs (does whatever is due right now)

concurrency:
  group: scans
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MARKET_DATA_PROVIDER: yahoo
      MORNING_SCAN_TIME: "09:20"
      AFTERNOON_SCAN_TIME: "15:00"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Check database secret
        run: test -n "$DATABASE_URL" || (echo "Add the DATABASE_URL repository secret" && exit 1)
      - name: Migrate database
        run: alembic upgrade head
      - name: Run whatever is due
        run: python -m app.scheduler.cron
