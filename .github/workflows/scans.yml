name: Scheduled scans

# PRIMARY trigger: cron-job.org calls GitHub's "workflow_dispatch" API at the exact times
# (IST 09:20, 09:25, 15:00, 15:20, 15:25, 16:00, 16:20, 16:25). A dispatched run starts within
# seconds, unlike GitHub's own scheduler, which was observed running hours late.
#
# BACKUP trigger: GitHub's scheduler below, once per session (times in UTC; IST = UTC+5:30).
# If it runs too late to scan, it fails (red) when a scan was missed today, so GitHub emails you.
#
# Each run works out what is due from the current IST time; weekends and NSE holidays are
# skipped by the app, and a scan that is already published is never run twice.
on:
  workflow_dispatch:
  schedule:
    - cron: "5 4 * * 1-5"   # 09:35 IST morning backup
    - cron: "45 9 * * 1-5"  # 15:15 IST afternoon backup
    - cron: "45 10 * * 1-5" # 16:15 IST close-performance backup

concurrency:
  group: scans
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MARKET_DATA_PROVIDER: yahoo
      MORNING_SCAN_TIME: "09:20"
      AFTERNOON_SCAN_TIME: "15:00"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Check database secret
        run: test -n "$DATABASE_URL" || (echo "Add the DATABASE_URL repository secret" && exit 1)
      - name: Migrate database
        run: alembic upgrade head
      - name: Run whatever is due
        run: python -m app.scheduler.cron
